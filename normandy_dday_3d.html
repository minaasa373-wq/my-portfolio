<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ノルマンディー上陸作戦 ─ 1944年6月6日 立体作戦図</title>
<style>
:root{
  --ink:#0d100c;
  --board:#141812;
  --vellum:#e7ddc4;
  --vellum-dim:#a9a289;
  --allied:#3f79c4;
  --allied-deep:#25508f;
  --axis:#b5382b;
  --signal:#e2a52f;
  --rule:rgba(231,221,196,.22);
  --rule-soft:rgba(231,221,196,.10);
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","MS PMincho",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Osaka-Mono","MS Gothic",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--vellum);
  font-family:var(--gothic);overscroll-behavior:none}
canvas{display:block}
#stage{position:fixed;inset:0}

/* ---- map-board frame + vignette ---------------------------------- */
#frame{position:fixed;inset:0;pointer-events:none;z-index:5}
#frame::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 45%,transparent 42%,rgba(6,8,6,.62) 100%)}
#frame::after{content:"";position:absolute;inset:10px;border:1px solid var(--rule-soft)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

/* ---- corner slug -------------------------------------------------- */
#slug{position:fixed;top:26px;left:26px;z-index:10;pointer-events:none;max-width:62vw}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--signal);
  text-transform:uppercase;display:flex;align-items:center;gap:9px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--signal),transparent);
  min-width:40px;opacity:.55}
#chapNo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--vellum-dim);margin-top:14px}
#chapTitle{font-family:var(--mincho);font-size:27px;line-height:1.25;margin-top:2px;letter-spacing:.06em;
  text-shadow:0 2px 14px rgba(0,0,0,.85)}
#chapTitle .en{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.24em;
  color:var(--vellum-dim);margin-top:7px;text-transform:uppercase}
.fade-swap{animation:swapIn .9s cubic-bezier(.16,.8,.3,1) both}
@keyframes swapIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---- narration card ----------------------------------------------- */
#narr{position:fixed;left:26px;bottom:132px;z-index:10;width:min(430px,74vw);
  background:linear-gradient(180deg,rgba(20,24,18,.90),rgba(13,16,12,.90));
  border:1px solid var(--rule);border-left:2px solid var(--signal);
  padding:14px 17px 15px;backdrop-filter:blur(7px)}
#narr .t{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--signal);margin-bottom:7px}
#narr .b{font-family:var(--mincho);font-size:14px;line-height:1.85;letter-spacing:.02em;color:var(--vellum)}

/* ---- transport / timeline ----------------------------------------- */
#deck{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:0 26px 20px;
  background:linear-gradient(0deg,rgba(9,11,8,.94) 42%,transparent)}
#deckRow{display:flex;align-items:flex-end;gap:16px}
#clock{font-family:var(--mono);flex:0 0 auto;line-height:1}
#clock .hm{font-size:34px;letter-spacing:.06em;color:var(--signal);font-variant-numeric:tabular-nums}
#clock .dd{font-size:9px;letter-spacing:.26em;color:var(--vellum-dim);margin-top:6px}
#track{flex:1 1 auto;position:relative;height:52px;cursor:pointer;touch-action:none}
#ticks{position:absolute;left:0;right:0;bottom:14px;height:22px}
.tick{position:absolute;bottom:0;width:1px;background:var(--rule);height:7px}
.tick.maj{height:14px;background:rgba(231,221,196,.4)}
.tick span{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;color:var(--vellum-dim);letter-spacing:.08em}
#bar{position:absolute;left:0;right:0;bottom:8px;height:5px;background:rgba(231,221,196,.13)}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--allied-deep),var(--allied))}
#chapMarks{position:absolute;left:0;right:0;bottom:8px;height:5px}
.cmark{position:absolute;top:-4px;width:1px;height:13px;background:rgba(231,221,196,.5)}
.cmark.hh{background:var(--axis);width:2px;height:19px;top:-7px}
#head{position:absolute;bottom:2px;width:2px;height:17px;background:var(--signal);
  box-shadow:0 0 9px var(--signal);transform:translateX(-1px)}
#eventPips{position:absolute;left:0;right:0;bottom:21px;height:8px}
.pip{position:absolute;width:5px;height:5px;transform:rotate(45deg) translateX(-2px);
  background:var(--allied);opacity:.55}
.pip.de{background:var(--axis)}
.pip.on{opacity:1;box-shadow:0 0 8px currentColor}

/* ---- buttons ------------------------------------------------------- */
.btnrow{display:flex;gap:7px;align-items:center;flex:0 0 auto}
button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--vellum);
  background:rgba(231,221,196,.05);border:1px solid var(--rule);padding:8px 11px;cursor:pointer;
  transition:background .18s,border-color .18s,color .18s}
button:hover{background:rgba(231,221,196,.13);border-color:rgba(231,221,196,.45)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button.on{color:var(--ink);background:var(--signal);border-color:var(--signal)}
#play{width:44px;height:38px;font-size:13px}

/* ---- legend / margin key ------------------------------------------- */
#key{position:fixed;top:24px;right:24px;z-index:11;width:212px;
  background:linear-gradient(180deg,rgba(20,24,18,.9),rgba(13,16,12,.9));
  border:1px solid var(--rule);backdrop-filter:blur(7px)}
#keyHead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  border-bottom:1px solid var(--rule-soft);cursor:pointer}
#keyHead b{font-family:var(--mono);font-size:10px;letter-spacing:.24em;font-weight:400;color:var(--vellum-dim)}
#keyBody{padding:12px;display:grid;gap:9px}
#key.closed #keyBody{display:none}
.krow{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.04em;color:var(--vellum-dim)}
.sw{width:22px;height:8px;flex:0 0 auto}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.toggles button{padding:7px 4px;text-align:center}
#chapList{margin-top:4px;border-top:1px solid var(--rule-soft);padding-top:9px;
  max-height:186px;overflow:auto;display:grid;gap:1px}
#chapList div{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--vellum-dim);
  padding:5px 6px;cursor:pointer;display:flex;gap:8px;transition:background .15s,color .15s}
#chapList div:hover{background:rgba(231,221,196,.09);color:var(--vellum)}
#chapList div.cur{color:var(--signal);background:rgba(226,165,47,.10)}
#chapList div i{font-style:normal;opacity:.7;flex:0 0 34px}

/* ---- loader --------------------------------------------------------- */
#load{position:fixed;inset:0;z-index:40;background:var(--ink);display:grid;place-items:center;
  transition:opacity .8s ease}
#load.gone{opacity:0;pointer-events:none}
#load .c{text-align:center}
#load .c h1{font-family:var(--mincho);font-size:23px;letter-spacing:.16em;font-weight:400;margin:0 0 12px}
#load .c p{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--vellum-dim);margin:0}
#load .c .ln{width:190px;height:1px;background:var(--rule);margin:20px auto 0;overflow:hidden}
#load .c .ln i{display:block;height:100%;width:34%;background:var(--signal);animation:sweep 1.25s infinite ease-in-out}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}

#hint{position:fixed;bottom:132px;right:26px;z-index:10;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;color:var(--vellum-dim);text-align:right;opacity:.7;pointer-events:none}

@media (max-width:820px){
  #slug{top:16px;left:16px;max-width:52vw}
  #chapTitle{font-size:19px}
  #key{top:14px;right:14px;width:152px}
  #chapList{max-height:150px}
  #narr{left:16px;right:16px;width:auto;bottom:124px;padding:11px 13px}
  #narr .b{font-size:12.5px;line-height:1.75}
  #deck{padding:0 14px 14px}
  #clock .hm{font-size:24px}
  #deckRow{gap:10px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){.fade-swap{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="frame"></div>
<div id="grain"></div>

<div id="slug">
  <div class="eyebrow">Operation Neptune &nbsp;/&nbsp; 6 June 1944</div>
  <div id="chapNo">CHAPTER 01</div>
  <div id="chapTitle">暗夜の海峡<span class="en">The Channel, before dawn</span></div>
</div>

<div id="key">
  <div id="keyHead"><b>凡例 / KEY</b><span style="font-family:var(--mono);font-size:10px" id="keyTgl">－</span></div>
  <div id="keyBody">
    <div class="krow"><span class="sw" style="background:linear-gradient(90deg,#25508f,#3f79c4)"></span>連合軍の進路</div>
    <div class="krow"><span class="sw" style="background:linear-gradient(90deg,#7a241b,#b5382b)"></span>ドイツ軍の反撃</div>
    <div class="krow"><span class="sw" style="background:repeating-linear-gradient(90deg,#7fb2e8 0 4px,transparent 4px 8px)"></span>空挺降下</div>
    <div class="toggles">
      <button data-t="arrows" class="on">矢印</button>
      <button data-t="units" class="on">部隊</button>
      <button data-t="labels" class="on">地名</button>
      <button data-t="fog" class="on">霧</button>
      <button data-t="fleet" class="on">艦隊</button>
      <button data-t="cam">自由視点</button>
    </div>
    <div id="chapList"></div>
  </div>
</div>

<div id="narr">
  <div class="t" id="narrT">00:15</div>
  <div class="b" id="narrB"></div>
</div>

<div id="hint">DRAG / WHEEL &nbsp;–&nbsp; 自由視点で操作<br>SPACE &nbsp;–&nbsp; 再生・停止</div>

<div id="deck">
  <div id="deckRow">
    <div class="btnrow">
      <button id="play">❚❚</button>
    </div>
    <div id="clock"><div class="hm" id="hm">00:00</div><div class="dd">D-DAY · JUNE 6, 1944</div></div>
    <div id="track">
      <div id="ticks"></div>
      <div id="eventPips"></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="chapMarks"></div>
      <div id="head"></div>
    </div>
    <div class="btnrow" id="speeds">
      <button data-s="0.5">×0.5</button>
      <button data-s="1" class="on">×1</button>
      <button data-s="2">×2</button>
      <button data-s="4">×4</button>
    </div>
  </div>
</div>

<div id="load"><div class="c">
  <h1>ノルマンディー上陸作戦</h1>
  <p>BUILDING TERRAIN</p>
  <div class="ln"><i></i></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   ノルマンディー上陸作戦 — 立体作戦図 / D-Day 3D situation map
   単一HTML · three.js r128
   ========================================================================== */
'use strict';

/* ---------- 数学ユーティリティ ------------------------------------------ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>b===a?0:clamp((v-a)/(b-a),0,1);
const smooth=t=>t*t*(3-2*t);
const smoother=t=>t*t*t*(t*(t*6-15)+10);
const ease=t=>lerp(t,smoother(t),.72);

function hash2(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296;}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=smooth(xf),v=smooth(yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);
}
function fbm(x,y,oct){let s=0,a=.5,f=1;for(let i=0;i<(oct||4);i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

/* ---------- 座標系 --------------------------------------------------------
   x : 西 −  →  + 東      z : 北(海) −  →  + 南(内陸)      y : 標高(強調表示)
   1 unit ≒ 500 m ／ 標高は約8倍に強調
   -------------------------------------------------------------------------- */

/* 海岸線（カルヴァドス海岸のz） */
function coastZ(x){ return Math.sin(x*.045)*.45 + Math.sin(x*.017+1.1)*.50 + Math.sin(x*.13+.4)*.22; }
/* コタンタン半島 東岸のx */
function eastCoastX(z){ return -80 + Math.sin(z*.06)*1.8 + Math.sin(z*.19)*.7; }
/* なめらかな和集合 */
function smax(a,b,k){const m=Math.max(a,b);return m+k*Math.log(1+Math.exp(-Math.abs(a-b)/k));}

/* 内陸度（>0 が陸） */
function inland(x,z){
  const main = z - coastZ(x) - 9.5*Math.exp(-Math.pow((x+70.5)/4.4,2));  // ヴェイ湾の切れ込み
  const pen  = Math.min(eastCoastX(z)-x, z+34);                          // コタンタン半島
  return smax(main,pen,1.15);
}
function shoreZ(x){let lo=-46,hi=50;for(let i=0;i<26;i++){const m=(lo+hi)/2;if(inland(x,m)>0)hi=m;else lo=m;}return hi;}

/* 河川・湛水域（負値ぶん地面を掘る） */
function water_carve(x,z){
  let c=0;
  const t=inv(-2,34,z), rx=lerp(30.6,26.2,t)+Math.sin(z*.19)*.5;         // オルヌ川・運河
  if(z>-2&&z<34) c=Math.max(c,1.15*Math.exp(-Math.pow((x-rx)/1.25,2)));
  const fl=Math.exp(-Math.pow((x+88)/6.0,2))*Math.exp(-Math.pow((z-9)/8,2))
          +Math.exp(-Math.pow((x+80)/6.5,2))*Math.exp(-Math.pow((z-18)/6.5,2));
  c=Math.max(c,fl*1.05);                                                 // 独軍による人工湛水
  if(z>6&&z<32) c=Math.max(c,.95*Math.exp(-Math.pow((x+68+(z-8)*.10)/1.3,2)));  // ヴィール川
  return c;
}

/* 標高 */
function heightAt(x,z){
  const d=inland(x,z);
  if(d<=0){                                       // ── 海
    const s=-d;
    return -.9-Math.min(5.4,Math.pow(s,.72)*.58)-fbm(x*.07,z*.07,3)*.22;
  }
  let h=.34*smooth(inv(0,1.1,d));                                 // 浜
  h += smooth(inv(.9,8,d))*.92;                                   // 海岸段丘
  h += smooth(inv(7,34,d))*.78;                                   // 内陸
  // 断崖海岸：グランカン〜アロマンシュ（米軍正面）だけが崖
  const cliff=smooth(inv(-64,-57,x))*(1-smooth(inv(-34,-27,x)));
  h += cliff*(smooth(inv(.7,2.4,d))-smooth(inv(3.5,13,d))*.62)*1.80;
  // オマハ背後の急崖
  h += 1.0*Math.exp(-Math.pow((x+46)/7.0,2))*smooth(inv(.7,2.2,d));
  // ポワント・デュ・オック
  h += 1.5*Math.exp(-Math.pow((x+58)/2.0,2))*Math.exp(-Math.pow((z-coastZ(x)-.4)/2.2,2))*smooth(inv(-.3,.7,d));
  // カーン南の高地 / ベサン内陸
  h += .72*Math.exp(-Math.pow((x-27)/17,2))*smooth(inv(18,42,z));
  h += .55*Math.exp(-Math.pow((x+28)/22,2))*smooth(inv(12,36,z));
  // ボカージュのうねり
  h += (fbm(x*.062,z*.062,4)-.5)*1.55*smooth(inv(.6,4.5,d));
  h += (fbm(x*.34,z*.34,3)-.5)*.24*smooth(inv(.4,3,d));
  h -= water_carve(x,z)*Math.min(h+.30,1.35);
  return h;
}

/* ---------- 地点 ---------------------------------------------------------- */
const PLACE={
  utah:[eastCoastX(-12)-.9,-12], stMere:[-92,3], carentan:[-73,22], hoc:[-58,shoreZ(-58)+.7],
  omaha:[-46,shoreZ(-46)+.9], bayeux:[-24,17], portBessin:[-33,shoreZ(-33)+.6],
  gold:[-15,shoreZ(-15)+1.1], juno:[2,shoreZ(2)+1.1], sword:[23,shoreZ(23)+1.1],
  ouistreham:[29.3,shoreZ(29.3)+1.5], pegasus:[33.5,11], merville:[37,shoreZ(37)+1.2],
  caen:[23.6,31], carpiquet:[19,28], ranville:[36,10]
};
const BEACH_LINE={utah:eastCoastX(-9)-1.2, omaha:-46, gold:-15, juno:2, sword:23};

/* 地表色（ヴェラム調のマップボード配色） */
const C=new THREE.Color();
function colorAt(x,z,h,slope){
  const d=inland(x,z);
  if(h<-.02){                                    // 海底：チャート風の濃紺
    const t=clamp(-h/6,0,1);
    C.setRGB(lerp(.105,.045,t),lerp(.155,.075,t),lerp(.185,.115,t));
    return C;
  }
  if(d<1.0){ C.setRGB(.70,.635,.47); }           // 砂浜
  else{
    // ボカージュ：区画ごとに色相を散らした耕地パターン
    const a=x*.28+z*.06, b=z*.30-x*.05;
    const cell=hash2(Math.floor(a),Math.floor(b));
    const cell2=hash2(Math.floor(a*.5)+91,Math.floor(b*.5)+37);
    let r=.255+cell*.115+cell2*.05, g=.295+cell*.10, bl=.175+cell*.055;
    if(cell>.80){ r=.44+cell*.10; g=.415; bl=.245; }        // 麦畑
    if(cell<.16){ r=.185; g=.235; bl=.155; }                // 生垣・林
    C.setRGB(r,g,bl);
  }
  if(water_carve(x,z)>.55&&h<.35) C.setRGB(.16,.22,.235);   // 湛水域
  const rock=clamp((slope-.24)*2.1,0,1);                    // 露岩・崖
  C.lerp(new THREE.Color(.335,.295,.245),rock*.85);
  const ao=1-clamp(slope*.5,0,.30);
  C.multiplyScalar(ao*(.92+fbm(x*.9,z*.9,2)*.16));
  return C;
}

/* ==========================================================================
   1. シーン基礎
   ========================================================================== */
const WORLD={x0:-130,x1:86,z0:-86,z1:94};
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.85));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a1020,.0085);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.5,900);
camera.position.set(6,78,-92);

const sun=new THREE.DirectionalLight(0xffffff,.9);
sun.position.set(-60,70,-40); scene.add(sun);
const hemi=new THREE.HemisphereLight(0x9fb6d0,0x2a2c22,.55); scene.add(hemi);
const amb=new THREE.AmbientLight(0x33405a,.35); scene.add(amb);

/* 空（内側から見る半球） */
const skyGeo=new THREE.SphereGeometry(620,32,20);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,
  uniforms:{top:{value:new THREE.Color(0x0a1024)},bot:{value:new THREE.Color(0x1d2438)},
            hz:{value:new THREE.Color(0x2a3348)}},
  vertexShader:`varying float vy; void main(){ vy=normalize(position).y;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top,bot,hz; varying float vy;
    void main(){ float t=clamp(vy,-1.,1.);
      vec3 c = t>0. ? mix(hz,top,pow(t,.62)) : mix(hz,bot,pow(-t,.6));
      gl_FragColor=vec4(c,1.);}`
});
const sky=new THREE.Mesh(skyGeo,skyMat); scene.add(sky);

/* ==========================================================================
   2. 地形メッシュ
   ========================================================================== */
const SEG_X=460,SEG_Z=340;
const tGeo=new THREE.PlaneGeometry(WORLD.x1-WORLD.x0,WORLD.z1-WORLD.z0,SEG_X,SEG_Z);
tGeo.rotateX(-Math.PI/2);
tGeo.translate((WORLD.x0+WORLD.x1)/2,0,(WORLD.z0+WORLD.z1)/2);
{
  const p=tGeo.attributes.position, n=p.count, col=new Float32Array(n*3);
  for(let i=0;i<n;i++) p.setY(i,heightAt(p.getX(i),p.getZ(i)));
  tGeo.computeVertexNormals();
  const nrm=tGeo.attributes.normal;
  for(let i=0;i<n;i++){
    const x=p.getX(i),z=p.getZ(i),y=p.getY(i);
    const c=colorAt(x,z,y,1-Math.abs(nrm.getY(i)));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  tGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
}

/* 等高線：斜面にだけ現れる海図/陸図ハッチング */
tMat.onBeforeCompile=sh=>{
  sh.vertexShader='varying vec3 vWP;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\n vWP=(modelMatrix*vec4(position,1.0)).xyz;');
  sh.fragmentShader='varying vec3 vWP;\n'+sh.fragmentShader.replace('#include <dithering_fragment>',
    `#include <dithering_fragment>
     float slope=1.0-abs(normalize(vNormal).y);
     float iv = vWP.y<0.0 ? 1.15 : 0.55;
     float f=fract(vWP.y/iv);
     float ln=smoothstep(0.0,0.075,f)*smoothstep(0.0,0.075,1.0-f);
     ln=(1.0-ln)*smoothstep(0.035,0.19,slope);
     gl_FragColor.rgb=mix(gl_FragColor.rgb,gl_FragColor.rgb*0.66,ln*0.7);`);
};

function waveNormalTex(){
  const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;
  const g=cv.getContext('2d'),img=g.createImageData(s,s);
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const u=x/s*Math.PI*2,v=y/s*Math.PI*2;
    const dx=Math.cos(u*3)*.5+Math.cos(u*7+v*2)*.28+Math.cos(v*5-u)*.2;
    const dy=Math.cos(v*4)*.5+Math.cos(v*9+u*3)*.24+Math.cos(u*6+v)*.18;
    const i=(y*s+x)*4;
    img.data[i]=128+dx*54; img.data[i+1]=128+dy*54; img.data[i+2]=250; img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(26,20);
  return t;
}

/* 汀線（マーチングスクエアで inland()=0 を追跡） */
function shoreLine(){
  const step=.7,pts=[];
  const V=(x,z)=>inland(x,z);
  const ip=(a,b,va,vb)=>a+(b-a)*(va/(va-vb));
  for(let x=WORLD.x0+2;x<WORLD.x1-2;x+=step){
    for(let z=WORLD.z0+2;z<WORLD.z1-2;z+=step){
      const a=V(x,z),b=V(x+step,z),c=V(x+step,z+step),d=V(x,z+step);
      const e=[];
      if((a>0)!==(b>0)) e.push([ip(x,x+step,a,b),z]);
      if((b>0)!==(c>0)) e.push([x+step,ip(z,z+step,b,c)]);
      if((c>0)!==(d>0)) e.push([ip(x+step,x,c,d),z+step]);
      if((d>0)!==(a>0)) e.push([x,ip(z+step,z,d,a)]);
      for(let i=0;i+1<e.length;i+=2){
        pts.push(new THREE.Vector3(e[i][0],.07,e[i][1]));
        pts.push(new THREE.Vector3(e[i+1][0],.07,e[i+1][1]));
      }
    }
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xdde8ef,transparent:true,opacity:.38}));
}
const foam=shoreLine(); scene.add(foam);

const cr=(a,b,c,d,t)=>{const t2=t*t,t3=t2*t;
  return .5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);};
const _p=new THREE.Vector3(),_l=new THREE.Vector3();
function cinema(m,clock){
  let i=0; while(i<CAM.length-2&&m>CAM[i+1].m) i++;
  const u=ease(inv(CAM[i].m,CAM[i+1].m,m));
  const k=j=>CAM[clamp(j,0,CAM.length-1)];
  const A=k(i-1),B=k(i),Cc=k(i+1),D=k(i+2);
  _p.set(cr(A.p[0],B.p[0],Cc.p[0],D.p[0],u),cr(A.p[1],B.p[1],Cc.p[1],D.p[1],u),cr(A.p[2],B.p[2],Cc.p[2],D.p[2],u));
  _l.set(cr(A.l[0],B.l[0],Cc.l[0],D.l[0],u),cr(A.l[1],B.l[1],Cc.l[1],D.l[1],u),cr(A.l[2],B.l[2],Cc.l[2],D.l[2],u));
  const fov=cr(A.f,B.f,Cc.f,D.f,u);
  const d=_p.distanceTo(_l), amp=clamp(d*.0045,.02,.34);
  _p.x+=Math.sin(clock*.31)*amp+Math.sin(clock*.17+1.7)*amp*.7;
  _p.y+=Math.sin(clock*.24+.6)*amp*.55;
  _p.z+=Math.cos(clock*.27+2.2)*amp;
  _l.x+=Math.sin(clock*.19+.9)*amp*.35;
  _p.y=Math.max(_p.y,ground(_p.x,_p.z)+1.6);
  camera.position.copy(_p); camera.lookAt(_l);
  if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();}
  return _l;
}

function updateArrows(m){
  arrowObjs.forEach(o=>{
    const a=o.def; let p;
    if(m<a.from){p=0;}
    else if(a.prog){
      p=1; for(let i=0;i<a.prog.length-1;i++){
        if(m<=a.prog[i+1][0]){p=lerp(a.prog[i][1],a.prog[i+1][1],inv(a.prog[i][0],a.prog[i+1][0],m));break;}
      }
    }else p=ease(inv(a.from,a.to,m));
    const on=p>.004&&SHOW.arrows;
    o.mesh.visible=on; o.head.visible=on;
    if(o.sprite) o.sprite.visible=p>.004&&!!SHOW.units;
    if(!on&&!(o.sprite&&o.sprite.visible))return;
    const rings=Math.max(1,Math.round(p*o.rings));
    o.mesh.geometry.setDrawRange(0,rings*o.idxPerRing);
    o.tex.offset.x-=.0022*(1+speed*.5);
    const pt=o.curve.getPointAt(clamp(p,.001,1));
    const tg=o.curve.getTangentAt(clamp(p,.001,1));
    o.head.position.copy(pt).addScaledVector(tg,a.w*2.2);
    o.head.quaternion.setFromUnitVectors(_up,tg.normalize());
    if(o.sprite){

  let any=false;
  for(let i=0;i<L.length;i++){
    const c=L[i],t=(m-c.t0)/c.dur;
    let a=0,y=c.g;
    if(t>0&&t<1.45){
      const f=clamp(t,0,1);
      y=lerp(c.g+c.h,c.g+.25,smooth(f));
      a=t<.08?t/.08:(t>1?1-inv(1,1.45,t):1);
      any=true;
    }
    pos[i*3]=c.x+Math.sin((c.t0+t)*2.1)*.6; pos[i*3+1]=y; pos[i*3+2]=c.z;
    al[i]=a;
  }
  chutes.geo.attributes.position.needsUpdate=true;
  chutes.geo.attributes.alpha.needsUpdate=true;
  chutes.pts.visible=any;
  dzRings.forEach((r,i)=>{
    const d=DZONES[i];
    const v=(m>d.t0-14&&m<d.t1+40)?.42+Math.sin(m*.9)*.18:0;
    r.material.opacity=Math.max(0,v);
    r.visible=v>.01;
  });
}
function updateFleet(m){
  LAYER.fleet.visible=!!SHOW.fleet;
  if(!SHOW.fleet)return;
  const drift=m*.0065;
  for(let i=0;i<BOMB_N;i++){
    const b=bombData[i];
    const y=.12+Math.sin(m*.55+b.ph)*.10;
    place(bombard.a,i,b.x+Math.sin(m*.02+b.ph)*1.4,y,b.z+drift*.4,Math.PI/2+Math.sin(m*.03+b.ph)*.05,b.s);
    place(bombard.b,i,b.x+Math.sin(m*.02+b.ph)*1.4,y,b.z+drift*.4,Math.PI/2+Math.sin(m*.03+b.ph)*.05,b.s);
  }
  bombard.a.instanceMatrix.needsUpdate=bombard.b.instanceMatrix.needsUpdate=true;
  for(let i=0;i<TRAN_N;i++){
    const t=tranData[i];
    const y=.10+Math.sin(m*.5+t.ph)*.09;
    place(transports.a,i,t.x,y,t.z+Math.sin(m*.01+t.ph)*.9,Math.PI/2,t.s);
    place(transports.b,i,t.x,y,t.z+Math.sin(m*.01+t.ph)*.9,Math.PI/2,t.s);
  }
  transports.a.instanceMatrix.needsUpdate=transports.b.instanceMatrix.needsUpdate=true;
  for(let i=0;i<CRAFT_N;i++){
    const c=craftData[i];
    const t=inv(c.go,c.go+c.dur,m);
    let x,z,s=c.s;
    if(m<c.go-6||t>=1){ s=0.0001; x=c.sx; z=c.sz; }
    else if(m<c.go){ x=c.sx; z=c.sz; }
    else{
      const u=smooth(t);
      x=lerp(c.sx,BEACH_X[c.b]+c.ox,u);
      z=lerp(c.sz,BEACH_Z[c.b]+c.oz,u);
    }
    const y=.09+Math.sin(m*.9+i)*.07;
    const ang=c.b===0?Math.PI:Math.PI/2;
    place(craft.a,i,x,y,z,ang,s);
    place(craft.b,i,x,y,z,ang,s);
  }
  craft.a.instanceMatrix.needsUpdate=craft.b.instanceMatrix.needsUpdate=true;
}
const emitAcc=EMIT.map(()=>0); let tracerAcc=0;
function updateFX(m,dm,dt){
  for(let i=0;i<EMIT.length;i++){
    const e=EMIT[i];
    if(m>=e.t0&&m<=e.t1){
      emitAcc[i]+=dm*e.rate*.20;
      while(emitAcc[i]>1){emitAcc[i]--; spawnSmoke(e.p[0],e.p[1],e.s,Math.random()<e.fire?1:0);}
    }else emitAcc[i]=0;
  }
  if((m>325&&m<430)||(m>430&&m<720&&Math.random()<.4)||(m>960&&m<1220&&Math.random()<.3)){
    tracerAcc+=dm*.55; while(tracerAcc>1){tracerAcc--; spawnTracer();}
  }
  for(let i=0;i<POOL.length;i++){
    const p=POOL[i]; if(!p.alive)continue;
    p.t+=dm; const u=p.t/p.life;
    if(u>=1){p.alive=false;p.sp.visible=false;continue;}
    p.sp.position.addScaledVector(p.v,dm);
    const s=lerp(p.s0,p.s1,p.kind?smoother(u):Math.pow(u,.6));
    p.sp.scale.set(s,s,1);
    p.sp.material.opacity=p.kind?(1-u)*.85:Math.min(1,u*7)*(1-u)*.52;
  }
  for(let i=0;i<TRACERS.length;i++){
    const t=TRACERS[i]; if(!t.alive)continue;
    t.t+=dm; const u=t.t/t.life;
    if(u>=1){t.alive=false;t.sp.visible=false;spawnSmoke(t.b.x,t.b.z,3.4,1);continue;}
    t.sp.visible=true;
    t.sp.position.lerpVectors(t.a,t.b,u);
    t.sp.position.y+=Math.sin(Math.PI*u)*t.h;
    const s=1.1+Math.sin(Math.PI*u)*.7;
    t.sp.scale.set(s,s,1);
    t.sp.material.opacity=.9*(1-u*.35);
  }
}
function clearFX(){
  POOL.forEach(p=>{p.alive=false;p.sp.visible=false;});
  TRACERS.forEach(t=>{t.alive=false;t.sp.visible=false;});
}

/* ==========================================================================
   11. 操作パネル
   ========================================================================== */
const $=id=>document.getElementById(id);
const elTicks=$('ticks'),elMarks=$('chapMarks'),elPips=$('eventPips'),elFill=$('fill'),
      elHead=$('head'),elHM=$('hm'),elList=$('chapList'),elNarrT=$('narrT'),elNarrB=$('narrB'),
      elChapNo=$('chapNo'),elChapT=$('chapTitle'),elPlay=$('play');

for(let h=0;h<=24;h++){
  const d=document.createElement('div');
  d.className='tick'+(h%3===0?' maj':'');
  d.style.left=(h/24*100)+'%';
  if(h%3===0){const s=document.createElement('span');s.textContent=String(h).padStart(2,'0');d.appendChild(s);}
  elTicks.appendChild(d);
}
CHAPTERS.forEach(c=>{
  const d=document.createElement('div'); d.className='cmark'; d.style.left=(c.t/1440*100)+'%';
  elMarks.appendChild(d);
});
{ const d=document.createElement('div'); d.className='cmark hh'; d.style.left=(390/1440*100)+'%';
  d.title='H-Hour'; elMarks.appendChild(d); }
const pipEls=CAPTIONS.map(c=>{
  const d=document.createElement('div');
  d.className='pip'+(c.t>940&&c.t<1200?' de':'');
  d.style.left=(c.t/1440*100)+'%'; elPips.appendChild(d); return d;
});
const listEls=CHAPTERS.map((c,i)=>{
  const d=document.createElement('div');
  d.innerHTML='<i>'+hhmm(c.t)+'</i>'+c.jp;
  d.onclick=()=>{seekMin(c.t);};
  elList.appendChild(d); return d;
});

function seekMin(m){
  playhead=minToP(m); simMin=prevMin=m; clearFX(); refreshHUD(true);
}
function setPlaying(v){ playing=v; elPlay.textContent=v?'❚❚':'▶'; }
elPlay.onclick=()=>{ if(playhead>=TOTAL-.01){seekMin(0);} setPlaying(!playing); };
$('speeds').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    speed=parseFloat(b.dataset.s);
    $('speeds').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  };
});
document.querySelectorAll('.toggles button').forEach(b=>{
  b.onclick=()=>{
    const k=b.dataset.t;
    if(k==='cam'){
      orbit.on=!orbit.on; b.classList.toggle('on',orbit.on);
      if(orbit.on) enterOrbit(lastLook);
      return;
    }
    if(k==='fog'){ SHOW.fog=SHOW.fog?0:1; fogScale=SHOW.fog?1:.14; }
    else SHOW[k]=SHOW[k]?0:1;
    b.classList.toggle('on',!!(k==='fog'?SHOW.fog:SHOW[k]));
    if(k==='arrows') LAYER.arrows.visible=!!SHOW.arrows;
    if(k==='fleet')  LAYER.fleet.visible=!!SHOW.fleet;
  };
});
if(innerWidth<820){ $('key').classList.add('closed'); $('keyTgl').textContent='＋'; }
$('keyHead').onclick=()=>{
  const k=$('key'); k.classList.toggle('closed');
  $('keyTgl').textContent=k.classList.contains('closed')?'＋':'－';
};
/* タイムラインのドラッグ操作 */
const track=$('track');
let scrubbing=false;
function scrubTo(clientX){
  const r=track.getBoundingClientRect();
  seekMin(clamp((clientX-r.left)/r.width,0,1)*1440);
}
track.addEventListener('pointerdown',e=>{scrubbing=true;track.setPointerCapture(e.pointerId);scrubTo(e.clientX);});
track.addEventListener('pointermove',e=>{if(scrubbing)scrubTo(e.clientX);});
addEventListener('pointerup',()=>scrubbing=false);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();elPlay.onclick();}
  if(e.code==='ArrowRight')seekMin(simMin+15);
  if(e.code==='ArrowLeft') seekMin(simMin-15);
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- HUD --------------------------------------------------------- */
let curChap=-1,curCap=-1;
function refreshHUD(force){
  elHM.textContent=hhmm(simMin);
  const pct=simMin/1440*100;
  elFill.style.width=pct+'%'; elHead.style.left=pct+'%';
  let ci=0; for(let i=0;i<CHAPTERS.length;i++) if(simMin>=CHAPTERS[i].t) ci=i;
  if(ci!==curChap||force){
    curChap=ci; const c=CHAPTERS[ci];
    elChapNo.textContent='CHAPTER '+c.no;
    elChapT.innerHTML=c.jp+'<span class="en">'+c.en+'</span>';
    elChapT.classList.remove('fade-swap'); void elChapT.offsetWidth; elChapT.classList.add('fade-swap');
    listEls.forEach((d,i)=>d.classList.toggle('cur',i===ci));
    if(listEls[ci]) listEls[ci].scrollIntoView({block:'nearest'});
  }
  let pi=0; for(let i=0;i<CAPTIONS.length;i++) if(simMin>=CAPTIONS[i].t) pi=i;
  if(pi!==curCap||force){
    curCap=pi;
    elNarrT.textContent=hhmm(CAPTIONS[pi].t);
    elNarrB.textContent=CAPTIONS[pi].c;
    $('narr').classList.remove('fade-swap'); void $('narr').offsetWidth; $('narr').classList.add('fade-swap');
    pipEls.forEach((d,i)=>d.classList.toggle('on',i===pi));
  }
}

/* ==========================================================================
   12. ループ
   ========================================================================== */
const noMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastLook=new THREE.Vector3(-10,0,4);
let last=-1,frames=0,clock=0;
function tick(now){
  requestAnimationFrame(tick);
  if(last<0) last=now;
  const dt=clamp((now-last)/1000,0,.05); last=now; clock+=dt;
  if(playing&&!scrubbing){
    playhead+=dt*speed;
    if(playhead>=TOTAL){playhead=TOTAL;setPlaying(false);}
  }
  prevMin=simMin; simMin=pToMin(playhead);
  let dm=simMin-prevMin;
  if(dm<0||dm>14){clearFX(); dm=0;}

  atmosphere(simMin);
  updateArrows(simMin);
  updateStatics(simMin);
  updateLabels();
  updateChutes(simMin);
  updateFleet(simMin);
  updateFX(simMin,dm,dt);
  seaNrm.offset.x+=dt*.006; seaNrm.offset.y-=dt*.010;

  if(orbit.on) orbitApply();
  else lastLook=cinema(simMin,noMotion?0:clock).clone();

  renderer.render(scene,camera);
  refreshHUD(false);
  if(++frames===3) $('load').classList.add('gone');
}
seekMin(0); setPlaying(true); refreshHUD(true);
requestAnimationFrame(tick);

</script>
